<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=value, initial-scale=1.0">
  <title>Leaflet Map: Nominatim Search & GeoJSON Overlay</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
 * {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  padding: 6px;
  gap: 6px;
}

h2 {
  margin: 0;
  font-size: 18px;
  flex-shrink: 0;
}

/* Compact search controls */
.control-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
  padding: 8px;
  background: #f5f5f5;
  border-radius: 6px;
  flex-shrink: 0;
}

.panel-section {
  flex: 1 1 220px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 5px 7px;
  font: inherit;
  border: 1px solid #bbb;
  border-radius: 4px;
}

textarea {
  height: 40px;
  resize: none;
}

input[type="checkbox"] {
  margin: 0 4px 0 0;
  vertical-align: middle;
}

button {
  cursor: pointer;
  padding: 5px 8px;
  min-height: 30px;
  font: inherit;
  font-weight: 600;
  border: 1px solid #aaa;
  border-radius: 4px;
  background: white;
  color: #222;
}

/* Compact region controls */
.region-state-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 0;
  flex-shrink: 0;
}

#region-state-status {
  font-size: 11px;
  margin: 0;
  flex-shrink: 0;
}

#region-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0;
  flex-shrink: 0;
}

.region-button {
  min-width: 0;
  min-height: 26px;
  padding: 3px 7px;
  margin: 0.2em;
  border: 1px solid #777;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

/* Map fills all remaining vertical space */
#map {
  width: 100%;
  flex: 1 1 0;
  min-height: 0;
  margin: 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

/* Mobile layout */
@media (max-width: 600px) {
  body {
    padding: 4px;
    gap: 4px;
  }

  h2 {
    font-size: 16px;
  }

  .control-panel {
    gap: 6px;
    padding: 6px;
  }

  .panel-section {
    flex: 1 1 45%;
    gap: 4px;
    font-size: 11px;
  }

  input[type="text"],
  textarea {
    padding: 4px;
  }

  textarea {
    height: 32px;
  }

  button {
    min-height: 26px;
    padding: 4px 6px;
    font-size: 11px;
  }

  .region-button {
    min-height: 24px;
    padding: 3px 5px;
    font-size: 10px;
  }
}

/* Tooltip labels */
.polygon-label {
  border: none;
  box-shadow: none;
  color: #222;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  white-space: normal;
  pointer-events: none;
}

.polygon-label::before {
  display: none;
}

  </style>
</head>

<body>

  <div class="control-panel">
    <!-- Section 1: Nominatim Search -->
    <div id="searching" hidden="true">
    <div class="panel-section">
      <label for="query"><strong>1. Search Places (Nominatim):</strong></label>

      <input type="text" id="query" placeholder="e.g., coffee shops in London" value="coffee shops in London" />

      <label>
        <input type="checkbox" id="search-visible-bounds" />
        Search only within the visible map area
      </label>

      <hr>

      <button onclick="searchNominatim()">Search & Plot</button>

      <label for="region-name">
        <strong>Search within a region:</strong>
      </label>

      <input
        type="text"
        id="region-name"
        placeholder="Enter region name"
      />

      <button onclick="searchNominatimInRegion()">
        Search within Region
      </button>
    </div>

    <div class="region-state-controls">
      <button type="button" onclick="copyRegionState()">
        Copy Region State
      </button>
    
      <button type="button" onclick="loadRegionStateFromClipboard()">
        Load Region State
      </button>
    </div>
    
    <div id="region-state-status" role="status" aria-live="polite"></div>
  </div>

    <button onclick="document.getElementById('searching').toggleAttribute('hidden')" style="font-size: 1em">Show/Hide Search</button>
    <button onclick="document.getElementById('region-buttons').style.display = document.getElementById('region-buttons').style.display == 'none' ? 'block' : 'none'; " style="font-size: 1em">Show/Hide Buttons</button>
    <button type="button" onclick="showCurrentLocation()">
      📍 My Location
    </button>

    <!-- <div id="region-buttons"></div> -->
    

    <!-- Section 2: GeoJSON Input -->
    <!-- <div class="panel-section">
      <label for="geojson-input"><strong>2. Overlay GeoJSON (Polygon/Feature):</strong></label>
      <textarea id="geojson-input"
        placeholder='Paste your {"type": "Feature", ...} or {"type": "Polygon", ...} here'></textarea>
      <button onclick="loadGeoJSON(JSON.parse(document.getElementById('geojson-input').value.trim()))">Submit
        Polygon</button>
    </div> -->
  </div>

  <div id="region-buttons" style="display: none;"></div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>

  <script src="regions.js"></script>
  <script src="metro.js"></script>
  <script>
    // --- MAP VIEW PERSISTENCE ---
    const MAP_VIEW_STORAGE_KEY = "leafletMapView";

    function getSavedMapView() {
      try {
        const saved = localStorage.getItem(MAP_VIEW_STORAGE_KEY);

        if (saved) {
          const view = JSON.parse(saved);

          if (
            Array.isArray(view.center) &&
            view.center.length === 2 &&
            view.center.every(Number.isFinite) &&
            Number.isFinite(view.zoom)
          ) {
            return view;
          }
        }
      } catch (error) {
        console.warn("Could not restore saved map view:", error);
      }

      return {
        center: [20, 0],
        zoom: 2
      };
    }

    const initialView = getSavedMapView();

    const map = L.map('map').setView(
      initialView.center,
      initialView.zoom
    );

    // Recalculate map dimensions when the viewport changes
    window.addEventListener("resize", () => {
      map.invalidateSize({ pan: false });
    });


    // Save the current center and zoom level
    function saveMapView() {
      const center = map.getCenter();

      const view = {
        center: [center.lat, center.lng],
        zoom: map.getZoom()
      };

      try {
        localStorage.setItem(
          MAP_VIEW_STORAGE_KEY,
          JSON.stringify(view)
        );
      } catch (error) {
        console.warn("Could not save map view:", error);
      }
    }

    // Save after the user pans or zooms
    map.on("moveend", saveMapView);
    map.on("zoomend", saveMapView);


    // Add OpenStreetMap tile layer
    const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let loaded = false;

    tileLayer.once("load", function () {
      if (loaded) return;

      loaded = true;

      // Create a button for every region
      createRegionButtons();

      // Load region polygons
      Object.values(REGIONS).forEach(region => {
        const name = region.properties?.name;

        if (!name) return;

        geoJsonLayers[name] = loadGeoJSON(region);

        // Ensure the saved color is applied to the loaded polygon
        applyRegionColor(name);
      });

      // --- RENDER METRO LINES ---
      Object.entries(LINES).forEach(([color, geojsonData]) => {
        addGeoJSONLine(geojsonData, color);
      });
    });


    // Isolated layers to hold items cleanly without mixing them up
    const markersLayer = L.layerGroup().addTo(map);
    let geoJsonLayers = {};

    // Independent layer group for GeoJSON lines
    const geoJsonLinesLayer = L.layerGroup().addTo(map);

    // --- 1. NOMINATIM SEARCH FUNCTION ---
    function searchNominatim() {
      const query = document.getElementById('query').value.trim();

      if (!query) return;

      // Clear previous markers
      markersLayer.clearLayers();

      const baseUrl = "https://nominatim.openstreetmap.org/search";

      const params = new URLSearchParams({
        format: "json",
        q: query,
        limit: "100",
        email: "your-email@example.com"
      });

      // Restrict results to the currently visible map bounds if checked
      const restrictToBounds = document.getElementById(
        'search-visible-bounds'
      ).checked;

      if (restrictToBounds) {
        const bounds = map.getBounds();

        // Nominatim viewbox order: left, top, right, bottom
        params.set("viewbox", [
          bounds.getWest(),
          bounds.getNorth(),
          bounds.getEast(),
          bounds.getSouth()
        ].join(","));

        // Restrict results to the specified bounding box
        params.set("bounded", "1");
      }

      const finalUrl = `${baseUrl}?${params.toString()}`;

      fetch(finalUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          if (data.length === 0) {
            alert("No results found in the specified area.");
            return;
          }

          const bounds = [];

          data.forEach(item => {
            const lat = parseFloat(item.lat);
            const lon = parseFloat(item.lon);

            const marker = L.marker([lat, lon])
              .bindPopup(item.display_name);

            markersLayer.addLayer(marker);
            bounds.push([lat, lon]);
          });

          // Zoom to the returned results only when searching globally.
          // When bounded search is enabled, preserve the current map view.
          if (bounds.length > 0 && !restrictToBounds) {
            map.fitBounds(bounds);
          }

          console.log(`Found ${data.length} results.`);
        })
        .catch(error => {
          console.error("Nominatim search error:", error);
          alert("Request failed. Check the browser console for details.");
        });
    }

    // --- REGION COLOR MANAGEMENT ---

const REGION_COLORS = [
  { name: "White",      value: "#eeeeee" },
  { name: "Yellow",     value: "#ffff00" },
  { name: "Light red",  value: "#ff9999" },
  { name: "Dark red",   value: "#cc0000" },
  { name: "Light blue", value: "#99ccff" },
  { name: "Dark blue",  value: "#0000cc" }
];

const REGION_STORAGE_KEY = "regionColors";

// Load saved colors from localStorage
let regionColors = {};

try {
  regionColors = JSON.parse(
    localStorage.getItem(REGION_STORAGE_KEY) || "{}"
  ) || {};
} catch (error) {
  console.warn("Could not load saved region colors:", error);
  regionColors = {};
}

// Return the configured color for a region, defaulting to white
function getRegionColor(regionName) {
  const savedColor = regionColors[regionName];

  const validColor = REGION_COLORS.find(
    color => color.value === savedColor
  );

  return validColor ? validColor.value : REGION_COLORS[0].value;
}

// Save region colors to localStorage
function saveRegionColors() {
  localStorage.setItem(
    REGION_STORAGE_KEY,
    JSON.stringify(regionColors)
  );
}

// Update a region's polygon and tooltip colors
function applyRegionColor(regionName) {
  const color = getRegionColor(regionName);
  const geoJsonLayer = geoJsonLayers[regionName];

  if (!geoJsonLayer) return;

  geoJsonLayer.setStyle({
    color: color,
    fillColor: color,
    weight: 5,
    opacity: 0.8,
    fillOpacity: 0.4
  });

  // Update tooltip backgrounds for all polygon features
  geoJsonLayer.eachLayer(layer => {
    const tooltip = layer.getTooltip();

    if (tooltip) {
      const element = tooltip.getElement();

      if (element) {
        element.style.backgroundColor = color;
        element.style.fontSize = "1em";
        element.style.color = color === "#0000cc" ? "#ffffff" : "#222222";
      }
    }
  });

  // Update the corresponding button
  const button = document.querySelector(
    `[data-region-name="${CSS.escape(regionName)}"]`
  );

  if (button) {
    button.style.backgroundColor = color;
    // button.style.fontSize = "2em";
    button.style.color = color === "#0000cc" ? "#ffffff" : "#222222";
    button.title = `${regionName}: ${REGION_COLORS.find(
      c => c.value === color
    ).name}. Click to change color.`;
  }
}

// Cycle to the next color
function cycleRegionColor(regionName) {
  const currentColor = getRegionColor(regionName);

  const currentIndex = REGION_COLORS.findIndex(
    color => color.value === currentColor
  );

  const nextIndex = (currentIndex + 1) % REGION_COLORS.length;

  regionColors[regionName] = REGION_COLORS[nextIndex].value;

  saveRegionColors();
  applyRegionColor(regionName);
}

// Create a button for each region
function createRegionButtons() {
  const container = document.getElementById("region-buttons");
  container.innerHTML = "";

  Object.values(REGIONS).forEach(region => {
    const regionName = region.properties?.name;

    if (!regionName) return;

    const button = document.createElement("button");

    button.type = "button";
    button.className = "region-button";
    button.textContent = regionName;
    button.dataset.regionName = regionName;

    button.addEventListener("click", () => {
      cycleRegionColor(regionName);
    });

    container.appendChild(button);

    // Apply saved color to the button
    applyRegionColor(regionName);
  });
}



function loadGeoJSON(geojsonData) {
  try {
    const regionName = geojsonData.properties?.name;
    const initialColor = regionName
      ? getRegionColor(regionName)
      : "#ffffff";

    let geoJsonLayer = L.geoJSON(geojsonData, {
      style: {
        color: initialColor,
        weight: 5,
        opacity: 0.8,
        fillColor: initialColor,
        fillOpacity: 0.4
      },

      onEachFeature: function (feature, layer) {
        const name = feature.properties?.name || "Unnamed Polygon";

        if (layer instanceof L.Polygon) {
          layer.bindTooltip(name, {
            permanent: true,
            direction: "center",
            className: "polygon-label",
            opacity: 1
          });

          // Retain the existing click behavior if desired
          // layer.on("click", function () {
          //   const randomColor = getRandomColor();
          //   updatePolygonColor(layer, randomColor);
          // });
        }
      }
    }).addTo(map);

    // Set tooltip backgrounds after the layer has been added
    geoJsonLayer.eachLayer(layer => {
      const tooltip = layer.getTooltip();

      if (tooltip) {
        const element = tooltip.getElement();

        if (element) {
          element.style.backgroundColor = initialColor;
        }
      }
    });

    return geoJsonLayer;

  } catch (error) {
    console.error("GeoJSON Parsing Error:", error);
    alert("Invalid GeoJSON data.");
  }
}


    // Update a polygon's color and its tooltip background
    function updatePolygonColor(layer, color) {
      // Update polygon style
      layer.setStyle({
        color: color,
        fillColor: color
      });

      // Update tooltip background color
      const tooltip = layer.getTooltip();

      if (tooltip) {
        tooltip.getElement()?.style.setProperty(
          "background-color",
          color
        );
      }
    }

    // Generate a random hexadecimal color
    function getRandomColor() {
      return "#" + Math.floor(Math.random() * 16777215)
        .toString(16)
        .padStart(6, "0");
    }

    // --- 3. NOMINATIM SEARCH WITHIN A NAMED REGION ---

function searchNominatimInRegion() {
  const query = document.getElementById('query').value.trim();
  const regionName = document.getElementById('region-name').value.trim();

  if (!query) {
    alert("Please enter a search query.");
    return;
  }

  if (!regionName) {
    alert("Please enter a region name.");
    return;
  }

  // Find the matching region, ignoring case
  const region = Object.values(REGIONS).find(item => {
    return item.properties?.name?.toLowerCase() === regionName.toLowerCase();
  });

  if (!region) {
    alert(`Region "${regionName}" was not found in REGIONS.`);
    return;
  }

  // Calculate the region's bounding box
  const regionLayer = L.geoJSON(region);
  const bounds = regionLayer.getBounds();

  if (!bounds.isValid()) {
    alert(`Region "${regionName}" has invalid boundaries.`);
    return;
  }

  // Build the Nominatim request
  const params = new URLSearchParams({
    format: "json",
    q: query,
    limit: "40",
    viewbox: [
      bounds.getWest(),
      bounds.getNorth(),
      bounds.getEast(),
      bounds.getSouth()
    ].join(","),
    bounded: "1"
  });

  const url =
    `https://nominatim.openstreetmap.org/search?${params.toString()}`;

  fetch(url)
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }

      return response.json();
    })
    .then(data => {
      // Remove previous search markers
      markersLayer.clearLayers();

      // Keep only results actually inside the region polygon
      const matchingResults = data.filter(item => {
        const point = turf.point([
          parseFloat(item.lon),
          parseFloat(item.lat)
        ]);

        return turf.booleanPointInPolygon(point, region);
      });

      if (matchingResults.length === 0) {
        alert(`No results found inside "${regionName}".`);
        return;
      }

      matchingResults.forEach(item => {
        const lat = parseFloat(item.lat);
        const lon = parseFloat(item.lon);

        L.marker([lat, lon])
          .bindPopup(item.display_name)
          .addTo(markersLayer);
      });

      console.log(
        `Found ${matchingResults.length} results inside "${regionName}".`
      );
    })
    .catch(error => {
      console.error("Regional Nominatim search error:", error);
      alert("Search failed. Check the browser console for details.");
    });
}

// Copy the current region colors to the clipboard
async function copyRegionState() {
  const state = JSON.stringify(regionColors, null, 2);

  try {
    await navigator.clipboard.writeText(state);
    document.getElementById("region-state-status").textContent =
      "Region state copied to clipboard.";
  } catch (error) {
    console.error("Clipboard copy failed:", error);

    // Fallback for browsers where Clipboard API is unavailable
    prompt("Copy this region state:", state);
  }
}


// Load region colors from the clipboard
async function loadRegionStateFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    const importedState = JSON.parse(text);

    if (
      !importedState ||
      typeof importedState !== "object" ||
      Array.isArray(importedState)
    ) {
      throw new Error("Invalid region state format.");
    }

    // Validate all imported colors before changing anything
    const validColors = new Set(
      REGION_COLORS.map(color => color.value)
    );

    for (const [name, color] of Object.entries(importedState)) {
      if (!Object.hasOwn(REGIONS, name)) {
        // Region names may not be the keys of REGIONS,
        // so validate against the region properties below.
        const knownRegion = Object.values(REGIONS).some(
          region => region.properties?.name === name
        );

        if (!knownRegion) {
          throw new Error(`Unknown region: ${name}`);
        }
      }

      if (!validColors.has(color)) {
        throw new Error(`Invalid color for region "${name}".`);
      }
    }

    // Apply imported colors
    regionColors = { ...regionColors, ...importedState };

    // Persist imported state
    saveRegionColors();

    // Update all region buttons and polygons
    Object.values(REGIONS).forEach(region => {
      const name = region.properties?.name;

      if (name) {
        applyRegionColor(name);
      }
    });

    document.getElementById("region-state-status").textContent =
      "Region state loaded successfully.";

  } catch (error) {
    console.error("Clipboard import failed:", error);

    document.getElementById("region-state-status").textContent =
      "Could not load region state. Check clipboard permissions and JSON format.";

    alert(
      "Unable to load region state. Make sure the clipboard contains valid JSON exported by Copy Region State."
    );
  }
}

// Add a GeoJSON line with a specified color
function addGeoJSONLine(geojsonData, color, options = {}) {
  try {
    const lineLayer = L.geoJSON(geojsonData, {
      style: {
        color: color,
        weight: options.weight ?? 5,
        opacity: options.opacity ?? 1,
        dashArray: options.dashArray ?? null
      },

      // Optional popup using the GeoJSON feature name
      onEachFeature: function (feature, layer) {
        const name = feature.properties?.name;

        if (name) {
          layer.bindPopup(name);
        }
      },

      // Support GeoJSON containing points as well as lines
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 4,
          color: color,
          fillColor: color,
          fillOpacity: 1
        });
      }
    });

    // Add to the dedicated line layer group, not the regions
    geoJsonLinesLayer.addLayer(lineLayer);

    return lineLayer;

  } catch (error) {
    console.error("Error adding GeoJSON line:", error);
    alert("Could not add the GeoJSON overlay.");
    return null;
  }
}

// --- CURRENT LOCATION MARKER ---
let currentLocationMarker = null;
let currentLocationAccuracy = null;

function showCurrentLocation() {
  if (!navigator.geolocation) {
    alert("Geolocation is not supported by your browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function (position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const location = [lat, lon];

      // Remove the previous location marker and accuracy circle
      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }

      if (currentLocationAccuracy) {
        map.removeLayer(currentLocationAccuracy);
      }

      // Add a marker at the current location
      currentLocationMarker = L.marker(location)
        .addTo(map)
        .bindPopup("<b>Your current location</b>")
        .openPopup();

      // Show the estimated GPS accuracy
      currentLocationAccuracy = L.circle(location, {
        radius: accuracy,
        color: "#136aec",
        fillColor: "#136aec",
        fillOpacity: 0.12,
        weight: 2
      }).addTo(map);

      // Center the map on the current location
      map.setView(location, Math.max(map.getZoom(), 15));
    },
    function (error) {
      let message;

      switch (error.code) {
        case error.PERMISSION_DENIED:
          message = "Location permission was denied. Allow location access in your browser settings.";
          break;
        case error.POSITION_UNAVAILABLE:
          message = "Your current location is unavailable.";
          break;
        case error.TIMEOUT:
          message = "The location request timed out. Please try again.";
          break;
        default:
          message = "Unable to retrieve your current location.";
      }

      alert(message);
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

  </script>
